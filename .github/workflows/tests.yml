name: tests

on:
  push:
    branches: [master, 'laravel-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, highest]

    name: PHP ${{ matrix.php }} · Laravel 13 · ${{ matrix.dependencies }} deps

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, curl, sqlite3, pdo_sqlite
          ini-values: display_errors=On, memory_limit=512M
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run tests
        run: vendor/bin/phpunit --display-deprecations --display-warnings --display-notices
